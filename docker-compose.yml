version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: pump_postgres
    environment:
      POSTGRES_DB: pump_monitoring
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pump_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pump_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pump_redis
    ports:
      - "6379:6379"
    networks:
      - pump_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml_service
    container_name: pump_ml_service
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pump_monitoring
      DB_USER: admin
      DB_PASSWORD: your_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: https://storage.yandexcloud.net
      S3_BUCKET: pump-data-bucket
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pump_network

  #mqtt:
  #image: eclipse-mosquitto:2
  #container_name: pump_mqtt
  #ports:
  #- "1883:1883"
  #- "9001:9001"
  #volumes:
  #- ./mosquitto/config:/mosquitto/config
  #networks:
  #- pump_network

  dashboard:
    build: ./dashboard
    container_name: pump_dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://ml-service:8000
    depends_on:
      - ml-service
    networks:
      - pump_network

networks:
  pump_network:
    driver: bridge

volumes:
  postgres_data:
